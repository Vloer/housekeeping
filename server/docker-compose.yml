version: '3.8'

services:
  housekeeping-api:
    build: .
    container_name: housekeeping-api
    ports:
      - "8000:8000"
    environment:
      - API_AUTH_TOKEN=${API_AUTH_TOKEN}
      - TZ=${TZ:-Etc/GMT-1}
    volumes:
      # Mount local directory to persist SQLite database outside container
      - .:/app
    restart: always

  dozzle:
    image: amir20/dozzle:latest
    container_name: dozzle
    ports:
      - "${DOZZLE_PORT:-8080}:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./users.yml:/data/users.yml:ro
    environment:
      - DOZZLE_AUTH_PROVIDER=${DOZZLE_AUTH_PROVIDER:-simple}
      - TZ=${TZ:-Etc/GMT-1}
    restart: always
